name: Build pocket-agents bootstrap

on:
  workflow_dispatch:
    inputs:
      add_packages:
        description: "Extra packages for --add (comma separated). Empty = default set only."
        required: false
        default: ""

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v7

      - name: Verify package name is ours
        run: |
          grep -n '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh
          grep -q '^TERMUX_APP__PACKAGE_NAME="com.pocketagents"' scripts/properties.sh \
            || { echo "properties.sh does not carry our package name"; exit 1; }

      - name: Free disk space
        run: ./scripts/free-space.sh

      # No zram here. ./.github/actions/zram compiles the module on the
      # runner, which needs kernel headers that aren't installed; upstream
      # only gets away with it because its Actions cache already holds a
      # prebuilt module, and caches don't cross repos. The default package
      # set is small enough not to need the extra swap. Revisit when adding
      # memory-hungry packages like libllvm.

      - name: Load builder image
        run: ./scripts/run-docker.sh true

      - name: Report starting resources
        run: |
          echo "cores=$(nproc)"; free -h; df -h / /mnt 2>/dev/null | tail -3

      # termux-am is built with Gradle and wants android-33 + build-tools
      # 30.0.3, but setup-android-sdk.sh only installs android-35/28/24.
      # Upstream never hits this because its CI pulls a prebuilt termux-am
      # deb with -I; we can't, since termux-am compiles TERMUX_APP_PACKAGE
      # into FakeContext.java and must be rebuilt for our package name.
      - name: Install SDK components needed by termux-am
        run: |
          ./scripts/run-docker.sh bash -c '
            set -eu
            if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            else
              SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
            fi
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
              "platforms;android-33" "build-tools;30.0.3"
          '

      # Deliberately no -f: it expands an unset var into `rm -f /*` (upstream bug).
      - name: Build bootstrap
        timeout-minutes: 320
        run: |
          set -o pipefail
          if [ -n "${{ inputs.add_packages }}" ]; then
            ./scripts/run-docker.sh ./scripts/build-bootstraps.sh \
              --architectures aarch64 --add "${{ inputs.add_packages }}"
          else
            ./scripts/run-docker.sh ./scripts/build-bootstraps.sh \
              --architectures aarch64
          fi

      - name: Report finishing resources
        if: always()
        run: df -h / /mnt 2>/dev/null | tail -3

      # Tarred first: deb filenames carry an epoch (ca-certificates-java_1:...)
      # and upload-artifact rejects colons outright.
      - name: Pack built debs
        if: always()
        run: |
          if [ -d output ] && [ -n "$(ls -A output 2>/dev/null)" ]; then
            tar cf debs-aarch64.tar -C output .
            echo "packed $(ls output | wc -l) files"
          else
            echo "no debs to pack"
          fi

      # Uploaded even on timeout/failure so a partial run can be resumed
      # instead of rebuilt from scratch.
      - name: Store built debs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debs-aarch64-${{ github.run_id }}
          path: debs-aarch64.tar
          if-no-files-found: warn

      - name: Store bootstrap archive
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-aarch64-${{ github.run_id }}
          path: "*.zip"
          if-no-files-found: error
